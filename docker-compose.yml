# Local infrastructure for the ad decision service.
# Start:  docker compose up -d     Stop:  docker compose down -v
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: ads
      POSTGRES_USER: ads
      POSTGRES_PASSWORD: ads
    ports:
      - "55432:5432"

  redis:
    image: redis:7.4-alpine
    ports:
      - "6379:6379"

  kafka:
    # Single-node KRaft broker; advertises localhost:9092 for an app running on the host.
    image: apache/kafka:3.8.0
    ports:
      - "9092:9092"
