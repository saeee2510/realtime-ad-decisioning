server:
  port: 8080

spring:
  application:
    name: ad-decision-service
  datasource:
    url: jdbc:postgresql://localhost:55432/ads
    username: ads
    password: ads
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: update
  data:
    redis:
      host: localhost
      port: 6379
  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.springframework.kafka.support.serializer.JsonSerializer
      properties:
        spring.json.add.type.headers: false
    consumer:
      group-id: spend-updater
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JsonDeserializer
      properties:
        spring.json.value.default.type: com.saee.addecision.events.AdEvent
        spring.json.trusted.packages: com.saee.addecision.events

ads:
  kafka:
    topic: ad-events
  cache:
    refresh-ms: 5000
    sync-ms: 1000
  seed:
    enabled: true
    count: 200

management:
  endpoints:
    web:
      exposure:
        include: health,metrics
